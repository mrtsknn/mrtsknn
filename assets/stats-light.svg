<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200">
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/>
  </linearGradient>
  <clipPath id="bar"><rect x="25" y="0" width="390" height="200" rx="5"/></clipPath>
</defs>
<style>
  text { font-family:'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif; }
  .title { font-size:17px; font-weight:700; fill:url(#accent); }
  .label { font-size:12.5px; fill:#59636e; }
  .value { font-size:20px; font-weight:700; fill:#1f2328; }
  .lang { font-size:12.5px; fill:#1f2328; }
  .pct { font-size:12px; fill:#59636e; }
  .fade { opacity:0; animation: fade .6s ease-out forwards; }
  .grow { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow 1s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes fade { to { opacity:1; } }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
<rect x="0.5" y="0.5" width="439" height="199" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<rect x="0.5" y="0.5" width="439" height="3" rx="1.5" fill="url(#accent)"/>
<text x="25" y="38" class="title">GitHub Özeti</text>
<g class="fade" style="animation-delay:0ms"><text x="25" y="78" class="value">2,341</text><text x="25" y="98" class="label">Toplam katkı</text></g>
<g class="fade" style="animation-delay:90ms"><text x="160" y="78" class="value">2,307</text><text x="160" y="98" class="label">Son 1 yıl</text></g>
<g class="fade" style="animation-delay:180ms"><text x="295" y="78" class="value">2,103</text><text x="295" y="98" class="label">Commit</text></g>
<g class="fade" style="animation-delay:270ms"><text x="25" y="140" class="value">2 gün</text><text x="25" y="160" class="label">Güncel seri</text></g>
<g class="fade" style="animation-delay:360ms"><text x="160" y="140" class="value">7 gün</text><text x="160" y="160" class="label">En uzun seri</text></g>
<g class="fade" style="animation-delay:450ms"><text x="295" y="140" class="value">9 · 0</text><text x="295" y="160" class="label">Repo · Yıldız</text></g>
</svg>
